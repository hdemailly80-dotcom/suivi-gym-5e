<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym 5e – Évaluation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--nuit:#1b1448; --royal:#5b3cc4; --rose:#f0387f; --or:#ffc83d; --ciel:#2aa7e8; --craie:#fffaf0; --menthe:#27c99a; --orange:#ff8a3c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; color:var(--nuit); font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:18px;
  background:radial-gradient(circle at 88% 6%, rgba(255,200,61,.35) 0 90px, transparent 91px), linear-gradient(175deg,#2c1d84 0%,#5b3cc4 55%,#f0387f 140%);
  background-attachment:fixed; padding-bottom:70px}
header{position:relative; text-align:center; padding:22px 16px 6px; color:#fff; overflow:hidden}
header svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
header h1{position:relative; margin:0; font-size:clamp(30px,5vw,48px); font-weight:800; line-height:1.05}
header p{position:relative; margin:4px 0 0; font-size:19px; opacity:.92}
.wrap{max-width:1000px; margin:0 auto; padding:10px 16px 0}
.carte{background:var(--craie); border-radius:26px 26px 26px 6px; padding:18px 20px; box-shadow:0 8px 0 rgba(27,20,72,.35); margin-top:16px}
.carte h2{margin:0 0 10px; font-size:26px}
.champs{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; align-items:end}
label{display:block; font-weight:700; font-size:17px; margin-bottom:4px}
input,select{width:100%; font:600 20px 'Baloo 2',sans-serif; padding:10px 14px; border-radius:14px; border:3px solid #cfc6f3; background:#fff; color:var(--nuit)}
input:focus,select:focus,button:focus-visible{outline:4px solid var(--or); outline-offset:2px}
.btn{border:0; border-radius:16px; padding:12px 26px; font:800 22px 'Baloo 2',sans-serif; background:var(--royal); color:#fff; cursor:pointer; box-shadow:0 5px 0 rgba(27,20,72,.3)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.sec{background:#e4defa; color:var(--nuit)}
.info{font-weight:600; color:#5a4f94; margin:8px 0 0}
.err{color:#b3123f; font-weight:700}
.elem{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:18px; margin-top:10px; color:#fff}
.elem b{font-size:22px}
.elem.voler{background:var(--ciel)} .elem.renverser{background:var(--rose)} .elem.tourner{background:#e9870b}
.elem button{border:0; border-radius:12px; padding:6px 14px; font:700 17px 'Baloo 2',sans-serif; cursor:pointer; background:rgba(255,255,255,.9); color:var(--nuit)}
.bloc{padding:14px 0; border-top:3px dashed #d9d0f6}
.bloc:first-of-type{border-top:0}
.bloc>b{display:block; font-size:22px; margin-bottom:8px}
.rang{display:flex; gap:10px; flex-wrap:wrap}
.pill{border:0; border-radius:16px; padding:10px 18px; font:800 22px 'Baloo 2',sans-serif; background:#e4defa; color:var(--nuit); cursor:pointer; box-shadow:0 4px 0 rgba(27,20,72,.22); min-width:64px}
.pill small{display:block; font-size:14px; font-weight:700}
.rang.m .pill{flex:1; min-width:140px}
.pill[aria-pressed=true]{color:#fff; background:var(--royal)}
.pill.p2[aria-pressed=true]{background:var(--menthe)} .pill.p1[aria-pressed=true]{background:#e9ac00; color:var(--nuit)} .pill.p0[aria-pressed=true]{background:var(--rose)}
.recap{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:6px}
.score{background:#0c0a22; border:4px solid var(--or); border-radius:16px; padding:8px 10px; text-align:center}
.score b{display:block; font:900 28px 'Orbitron',monospace; color:#ffd24a; text-shadow:0 0 12px rgba(255,200,61,.6)}
.score small{color:#9fa0d8; font-size:15px}
.score.total{grid-column:1/-1}
.score.total b{font-size:clamp(38px,9vw,58px)}
.fond{position:fixed; inset:0; background:rgba(27,20,72,.72); display:none; align-items:center; justify-content:center; padding:16px; z-index:10}
.fond.on{display:flex}
.boite{background:var(--craie); border-radius:28px; padding:24px; max-width:520px; width:100%; text-align:center; box-shadow:0 10px 0 rgba(0,0,0,.3)}
.boite p{margin:0 0 16px; font-size:21px; line-height:1.3}
.boite .acts{display:flex; gap:12px; justify-content:center}
.tapis{position:fixed; left:0; right:0; bottom:0; height:34px; background:repeating-linear-gradient(90deg,#2aa7e8 0 90px,#1f8ccb 90px 180px); border-top:6px solid #fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 1000 150" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-10 120 C 120 20, 200 150, 330 70 S 520 10, 640 80 S 860 140, 1010 30" fill="none" stroke="#ffc83d" stroke-width="7" stroke-linecap="round" opacity=".85"/>
    <path d="M-10 140 C 140 60, 230 160, 370 100 S 560 40, 680 110 S 880 150, 1010 70" fill="none" stroke="#ff7ab0" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <circle cx="95" cy="38" r="22" fill="#ffc83d"/><circle cx="95" cy="38" r="13" fill="none" stroke="#5b3cc4" stroke-width="4"/>
  </svg>
  <h1>Gym 5e : évaluation</h1>
  <p>Trois éléments, trois agrès différents : prépare ton passage.</p>
</header>

<div class="wrap">
  <section class="carte">
    <h2>1. Mon passage</h2>
    <div class="champs">
      <div><label for="classe">Classe</label>
        <select id="classe"><option>5A</option><option>5B</option><option>5C</option><option>5D</option><option>5E</option></select></div>
      <div><label for="eleve">Mon pseudo</label><input id="eleve" autocomplete="off" maxlength="40"></div>
      <div><button class="btn" id="charger">Charger mes figures</button></div>
    </div>
    <p class="info" id="msg"></p>

    <div id="choix" hidden>
      <div class="champs" style="margin-top:14px">
        <div><label for="sv">Verbe</label><select id="sv"></select></div>
        <div><label for="sa">Agrès</label><select id="sa" disabled></select></div>
        <div><label for="se">Exercice</label><select id="se" disabled></select></div>
        <div><button class="btn" id="ajout" disabled>Ajouter</button></div>
      </div>
    </div>
    <div id="elems"></div>
  </section>

  <section class="carte" id="prof">
    <h2>2. Notation (enseignant)</h2>
    <div id="verrou" class="champs">
      <div><label for="code">Code enseignant</label><input id="code" type="password" autocomplete="off"></div>
      <div><button class="btn" id="ouvrir">Déverrouiller</button></div>
    </div>
    <div id="notes" hidden></div>
  </section>
</div>

<div class="fond" id="fond"><div class="boite" id="boite"></div></div>
<div class="tapis"></div>

<script>
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbxOS3FvbDMj50oNbwVEpE0KgvpbffS4H69KH6u41QWYAItsIhTVQFbOzMGD0JM803eX/exec';

const PTS = {A:0.5, B:1, C:1.5, D:2, E:2.5};
const AGRES = {sol:'Sol', poutre:'Poutre', asym:'Barres asymétriques', parall:'Barres parallèles'};
const VERBES = [
  {id:'voler', nom:'Voler', exos:[{col:4, ag:'sol', nom:'Salto avant'}, {col:5, ag:'sol', nom:'Sauts'}, {col:6, ag:'poutre', nom:'Sortie'}, {col:7, ag:'asym', nom:'Sortie'}]},
  {id:'renverser', nom:'Se renverser', exos:[{col:8, ag:'sol', nom:'ATR'}, {col:9, ag:'sol', nom:'Roue'}, {col:10, ag:'asym', nom:'ATR'}, {col:11, ag:'poutre', nom:'Sortie'}]},
  {id:'tourner', nom:'Tourner', exos:[{col:12, ag:'sol', nom:'Roulade avant'}, {col:13, ag:'sol', nom:'Roulade arrière'}, {col:14, ag:'asym', nom:'Rotation avant-arrière'}, {col:15, ag:'parall', nom:'Rotation avant'}]}
];
const FLU = [1, 1.75, 2.5];
const SEC = [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4];

const $ = s => document.querySelector(s);
const f = n => n.toLocaleString('fr-FR', {maximumFractionDigits:2});
const pts = n => f(n) + (n > 1 ? ' pts' : ' pt');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const exoDe = col => VERBES.flatMap(v => v.exos).find(e => e.col === col);

let niveaux = {}, pseudo = '', charge = false, elements = {}, code = null, flu = null, sec = null;

/* ---------- appels au script ---------- */
async function appel(params, post) {
  const r = post
    ? await fetch(URL_SCRIPT, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(params)})
    : await fetch(URL_SCRIPT + '?' + new URLSearchParams(params));
  return r.json();
}

/* ---------- fenêtres ---------- */
function fenetre(html, actions) {
  $('#boite').innerHTML = html + '<div class="acts"></div>';
  actions.forEach(a => {
    const b = document.createElement('button'); b.className = 'btn' + (a.sec ? ' sec' : ''); b.textContent = a.txt;
    b.onclick = () => { $('#fond').classList.remove('on'); if (a.fn) a.fn(); };
    $('#boite .acts').appendChild(b);
  });
  $('#fond').classList.add('on');
}
const info = msg => fenetre(`<p class="err">${esc(msg)}</p>`, [{txt:'OK'}]);

/* ---------- 1. choix de l'élève ---------- */
$('#charger').onclick = async () => {
  const e = $('#eleve').value.trim();
  if (!e) { $('#msg').innerHTML = '<span class="err">Écris ton pseudo.</span>'; return; }
  $('#msg').textContent = 'Chargement…';
  try {
    const d = await appel({action:'figures', classe:$('#classe').value, eleve:e});
    if (d.status === 'absent') { $('#msg').innerHTML = '<span class="err">Pseudo introuvable dans cette classe : vérifie l’orthographe et la classe.</span>'; return; }
    if (d.status !== 'ok') { $('#msg').innerHTML = `<span class="err">${esc(d.message || 'Erreur inconnue.')}</span>`; return; }
    niveaux = d.niveaux; pseudo = d.pseudo; charge = true; elements = {}; flu = null; sec = null;
    const n = Object.keys(niveaux).length;
    $('#msg').textContent = n ? `${pseudo} : ${n} figure${n > 1 ? 's' : ''} validée${n > 1 ? 's' : ''}.` : `${pseudo} n’a encore validé aucune figure.`;
    tout();
  } catch (err) { $('#msg').innerHTML = '<span class="err">Impossible de joindre le tableau : vérifie la connexion.</span>'; }
};
$('#eleve').oninput = () => { if (charge) { charge = false; elements = {}; niveaux = {}; $('#msg').textContent = ''; tout(); } };
$('#classe').onchange = $('#eleve').oninput;

const agresPris = sauf => new Set(Object.entries(elements).filter(([v]) => v !== sauf).map(([, el]) => exoDe(el.col).ag));

function choixVerbe() {
  $('#sv').innerHTML = '<option value="">Choisis un verbe</option>' + VERBES.map(v =>
    `<option value="${v.id}"${elements[v.id] ? ' disabled' : ''}>${v.nom}${elements[v.id] ? ' (choisi)' : ''}</option>`).join('');
  $('#sa').innerHTML = ''; $('#sa').disabled = true; $('#se').innerHTML = ''; $('#se').disabled = true; $('#ajout').disabled = true;
}
$('#sv').onchange = () => {
  const v = VERBES.find(x => x.id === $('#sv').value), pris = agresPris(v && v.id);
  $('#se').innerHTML = ''; $('#se').disabled = true; $('#ajout').disabled = true;
  if (!v) { $('#sa').innerHTML = ''; $('#sa').disabled = true; return; }
  const ags = [...new Set(v.exos.map(e => e.ag))];
  $('#sa').innerHTML = '<option value="">Choisis un agrès</option>' + ags.map(a => {
    const dispo = v.exos.some(e => e.ag === a && niveaux[e.col]);
    const raison = pris.has(a) ? ' (déjà utilisé)' : !dispo ? ' (aucune figure validée)' : '';
    return `<option value="${a}"${raison ? ' disabled' : ''}>${AGRES[a]}${raison}</option>`;
  }).join('');
  $('#sa').disabled = false;
};
$('#sa').onchange = () => {
  const v = VERBES.find(x => x.id === $('#sv').value), a = $('#sa').value;
  const liste = v.exos.filter(e => e.ag === a && niveaux[e.col]);
  $('#se').innerHTML = (liste.length > 1 ? '<option value="">Choisis un exercice</option>' : '') + liste.map(e =>
    `<option value="${e.col}">${e.nom} · niveau ${niveaux[e.col]} (${pts(PTS[niveaux[e.col]])})</option>`).join('');
  $('#se').disabled = false; $('#ajout').disabled = !$('#se').value;
};
$('#se').onchange = () => { $('#ajout').disabled = !$('#se').value; };
$('#ajout').onclick = () => {
  const v = $('#sv').value, col = Number($('#se').value);
  if (!v || !col) return;
  elements[v] = {col, maitrise:null}; tout();
};

function dessinerElems() {
  $('#elems').innerHTML = VERBES.filter(v => elements[v.id]).map(v => {
    const e = exoDe(elements[v.id].col), n = niveaux[e.col];
    return `<div class="elem ${v.id}"><span><b>${v.nom}</b> : ${AGRES[e.ag]} · ${e.nom} · niveau ${n} (${pts(PTS[n])})</span>
      <button data-rm="${v.id}">Retirer</button></div>`;
  }).join('');
}
$('#elems').onclick = ev => { const b = ev.target.closest('[data-rm]'); if (b) { delete elements[b.dataset.rm]; flu = null; sec = null; tout(); } };

/* ---------- 2. notation par l'enseignant ---------- */
$('#ouvrir').onclick = async () => {
  const c = $('#code').value;
  try {
    const d = await appel({action:'code', code:c}, true);
    if (d.status !== 'ok') return info(d.message || 'Code incorrect.');
    code = c; tout();
  } catch (err) { info('Impossible de joindre le tableau : vérifie la connexion.'); }
};

const pret = () => VERBES.every(v => elements[v.id] && elements[v.id].maitrise !== null);
function calc() {
  let perf = 0, mait = 0;
  VERBES.forEach(v => { const e = elements[v.id]; if (e && e.maitrise !== null) { mait += e.maitrise; if (e.maitrise > 0) perf += PTS[niveaux[e.col]]; } });
  return {perf, mait, flu:flu || 0, sec:sec || 0, total:perf + mait + (flu || 0) + (sec || 0)};
}

function dessinerNotes() {
  const zone = $('#notes');
  if (!code) { zone.hidden = true; return; }
  zone.hidden = false;
  if (!charge || VERBES.some(v => !elements[v.id])) { zone.innerHTML = '<p class="info">L’élève doit d’abord charger ses figures et choisir ses 3 éléments (un par verbe).</p>'; return; }
  const m = [['2', '1er essai'], ['1', '2ᵉ essai'], ['0', 'raté 2 fois']];
  const c = calc(), ok = pret() && flu !== null && sec !== null;
  zone.innerHTML = VERBES.map(v => {
    const e = exoDe(elements[v.id].col), cur = elements[v.id].maitrise;
    return `<div class="bloc"><b>${v.nom} : ${AGRES[e.ag]} · ${e.nom} (niveau ${niveaux[e.col]})</b>
      <div class="rang m">${m.map(([val, t]) => `<button class="pill p${val}" data-k="m" data-v="${v.id}:${val}" aria-pressed="${cur === Number(val)}">${val}<small>${t}</small></button>`).join('')}</div></div>`;
  }).join('') + `
    <div class="bloc"><b>Fluidité de l’enchaînement (sur 2,5)</b>
      <div class="rang">${FLU.map(x => `<button class="pill" data-k="flu" data-v="${x}" aria-pressed="${flu === x}">${f(x)}</button>`).join('')}</div></div>
    <div class="bloc"><b>Sécurité et autonomie sur le cycle (sur 4)</b>
      <div class="rang">${SEC.map(x => `<button class="pill" data-k="sec" data-v="${x}" aria-pressed="${sec === x}">${f(x)}</button>`).join('')}</div></div>
    <div class="recap">
      <div class="score"><b>${f(c.perf)}</b><small>performance / 7,5</small></div>
      <div class="score"><b>${f(c.mait)}</b><small>maîtrise / 6</small></div>
      <div class="score"><b>${f(c.flu)}</b><small>fluidité / 2,5</small></div>
      <div class="score"><b>${f(c.sec)}</b><small>sécurité / 4</small></div>
      <div class="score total"><b>${f(c.total)} / 20</b><small>note totale</small></div>
    </div>
    <p style="margin:16px 0 0"><button class="btn" id="enreg"${ok ? '' : ' disabled'}>Enregistrer l’évaluation</button></p>`;
}
$('#notes').onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'enreg') return enregistrer(false);
  const k = b.dataset.k, v = b.dataset.v;
  if (k === 'm') { const [id, val] = v.split(':'); elements[id].maitrise = Number(val); }
  else if (k === 'flu') flu = Number(v);
  else if (k === 'sec') sec = Number(v);
  dessinerNotes();
};

async function enregistrer(confirmer) {
  const c = calc();
  fenetre('<p>Envoi en cours…</p>', []);
  try {
    const els = {}; VERBES.forEach(v => els[v.id] = {col:elements[v.id].col, maitrise:elements[v.id].maitrise});
    const d = await appel({action:'evaluer', classe:$('#classe').value, eleve:pseudo, code, confirm:confirmer, elements:els, fluidite:flu, securite:sec}, true);
    if (d.status === 'existe') return fenetre(`<p><b>${esc(pseudo)}</b> a déjà une évaluation enregistrée. La remplacer ?</p>`,
      [{txt:'Annuler', sec:true}, {txt:'Remplacer', fn:() => enregistrer(true)}]);
    if (d.status !== 'ok') return info(d.message || 'Erreur inconnue.');
    fenetre(`<p><b>Évaluation enregistrée pour ${esc(pseudo)} !</b></p>
      <div class="score total" style="margin-bottom:14px"><b>${f(c.total)} / 20</b><small>note totale</small></div>`,
      [{txt:'Élève suivant', fn:nouvelEleve}]);
  } catch (err) { info('Impossible d’envoyer : vérifie la connexion et réessaie.'); }
}

function nouvelEleve() {
  niveaux = {}; pseudo = ''; charge = false; elements = {}; flu = null; sec = null;
  $('#eleve').value = ''; $('#msg').textContent = ''; tout();
}

function tout() {
  $('#choix').hidden = !charge;
  if (charge) choixVerbe();
  dessinerElems();
  $('#verrou').hidden = !!code;
  dessinerNotes();
}
tout();
</script>
</body>
</html>
