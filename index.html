<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym 5e – Valider mes figures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#1b1448; --royal:#5b3cc4; --rose:#f0387f; --or:#ffc83d; --ciel:#2aa7e8;
  --craie:#fffaf0; --menthe:#27c99a; --orange:#ff8a3c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--nuit);
  font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:18px;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,200,61,.35) 0 90px, transparent 91px),
    linear-gradient(175deg,#2c1d84 0%,#5b3cc4 55%,#f0387f 140%);
  background-attachment:fixed; padding-bottom:70px;
}
header{position:relative; text-align:center; padding:22px 16px 6px; color:#fff; overflow:hidden}
header svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
header h1{position:relative; margin:0; font-size:clamp(30px,5vw,48px); font-weight:800; line-height:1.05; letter-spacing:.5px}
header p{position:relative; margin:4px 0 0; font-size:19px; opacity:.92}
.wrap{max-width:1000px; margin:0 auto; padding:10px 16px 0}
.carte{background:var(--craie); border-radius:26px 26px 26px 6px; padding:18px 20px; box-shadow:0 8px 0 rgba(27,20,72,.35); margin-top:14px}
.onglets{display:flex; gap:10px; margin-top:12px}
.onglets button{flex:1; border:0; padding:12px 10px; border-radius:20px 20px 4px 4px; font:800 21px 'Baloo 2',sans-serif;
  background:rgba(255,255,255,.22); color:#fff; cursor:pointer}
.onglets button[aria-selected=true]{background:var(--craie); color:var(--nuit)}
.champs{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px}
label{display:block; font-weight:700; font-size:17px; margin-bottom:4px}
input,select{width:100%; font:600 20px 'Baloo 2',sans-serif; padding:10px 14px; border-radius:14px; border:3px solid #cfc6f3; background:#fff; color:var(--nuit)}
input:focus,select:focus,button:focus-visible{outline:4px solid var(--or); outline-offset:2px}
.verbes{display:flex; gap:10px; margin:18px 0 6px; flex-wrap:wrap}
.verbes button{flex:1; min-width:150px; border:0; border-radius:999px; padding:12px 14px; font:800 22px 'Baloo 2',sans-serif; color:#fff; cursor:pointer; opacity:.55; transition:opacity .15s, transform .15s}
.verbes button[aria-pressed=true]{opacity:1; transform:translateY(-3px); box-shadow:0 5px 0 rgba(27,20,72,.3)}
.v-voler{background:var(--ciel)} .v-renverser{background:var(--rose)} .v-tourner{background:var(--orange)}
.exo{padding:14px 0; border-top:3px dashed #d9d0f6}
.exo:first-child{border-top:0}
.exo-t{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px}
.exo-t b{font-size:23px}
.sur{background:var(--nuit); color:var(--or); border-radius:999px; padding:2px 14px; font-weight:700; white-space:nowrap}
.nivs{display:flex; gap:10px}
.niv{flex:1; min-width:0; border:0; border-radius:18px; padding:8px 0 6px; color:#fff; cursor:pointer; line-height:1.05;
  box-shadow:0 5px 0 rgba(27,20,72,.28); transition:transform .08s}
.niv:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(27,20,72,.28)}
.niv span{display:block; font:800 32px 'Baloo 2',sans-serif}
.niv small{display:block; font-size:15px; font-weight:700}
.nA{background:#2aa7e8}.nB{background:#27c99a}.nC{background:#e9ac00;color:var(--nuit)}.nD{background:#ff8a3c}.nE{background:#f0387f}
.btn{border:0; border-radius:16px; padding:12px 26px; font:800 22px 'Baloo 2',sans-serif; background:var(--royal); color:#fff; cursor:pointer; box-shadow:0 5px 0 rgba(27,20,72,.3)}
.btn.sec{background:#e4defa; color:var(--nuit)}
.res{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-top:3px dashed #d9d0f6}
.res:first-of-type{border-top:0}
.badge{min-width:54px; text-align:center; border-radius:14px; padding:4px 12px; font:800 26px 'Baloo 2',sans-serif; color:#fff}
.badge.vide{background:#e4defa; color:#8a80b8}
.info{font-weight:600; color:#5a4f94; margin:4px 0 0}
.fond{position:fixed; inset:0; background:rgba(27,20,72,.72); display:none; align-items:center; justify-content:center; padding:16px; z-index:10}
.fond.on{display:flex}
.boite{background:var(--craie); border-radius:28px; padding:24px; max-width:520px; width:100%; text-align:center; box-shadow:0 10px 0 rgba(0,0,0,.3)}
.boite p{margin:0 0 16px; font-size:21px; line-height:1.3}
.boite .acts{display:flex; gap:12px; justify-content:center}
.tableau{display:inline-block; background:#0c0a22; border:5px solid var(--or); border-radius:16px; padding:10px 26px; margin:6px 0 14px}
.tableau b{display:block; font:900 clamp(40px,10vw,64px) 'Orbitron',monospace; color:#ffd24a; text-shadow:0 0 14px rgba(255,200,61,.7)}
.tableau small{color:#9fa0d8; font-size:16px}
.tapis{position:fixed; left:0; right:0; bottom:0; height:34px; background:repeating-linear-gradient(90deg,#2aa7e8 0 90px,#1f8ccb 90px 180px); border-top:6px solid #fff}
.err{color:#b3123f; font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 1000 150" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-10 120 C 120 20, 200 150, 330 70 S 520 10, 640 80 S 860 140, 1010 30" fill="none" stroke="#ffc83d" stroke-width="7" stroke-linecap="round" opacity=".85"/>
    <path d="M-10 140 C 140 60, 230 160, 370 100 S 560 40, 680 110 S 880 150, 1010 70" fill="none" stroke="#ff7ab0" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <circle cx="905" cy="38" r="22" fill="#ffc83d"/><circle cx="905" cy="38" r="13" fill="none" stroke="#5b3cc4" stroke-width="4"/>
  </svg>
  <h1>Gym 5e : valide tes figures</h1>
  <p>Voler, se renverser, tourner : chaque niveau compte pour ta note.</p>
</header>

<div class="wrap">
  <div class="onglets" role="tablist">
    <button role="tab" id="t-val" aria-selected="true">Valider une figure</button>
    <button role="tab" id="t-rec" aria-selected="false">Retrouver mes validations</button>
  </div>

  <section class="carte" id="p-val">
    <div class="champs">
      <div><label for="classe">Classe</label>
        <select id="classe"><option>5A</option><option>5B</option><option>5C</option><option>5D</option><option>5E</option></select></div>
      <div><label for="eleve">Mon pseudo</label><input id="eleve" autocomplete="off" maxlength="40"></div>
      <div><label for="valid">Pseudo du validateur</label><input id="valid" autocomplete="off" maxlength="40"></div>
    </div>
    <div class="verbes" id="verbes"></div>
    <div id="exos"></div>
  </section>

  <section class="carte" id="p-rec" hidden>
    <div class="champs">
      <div><label for="classe2">Classe</label><select id="classe2"></select></div>
      <div><label for="eleve2">Mon pseudo</label><input id="eleve2" autocomplete="off" maxlength="40"></div>
      <div><label for="verbe2">Verbe</label>
        <select id="verbe2"><option value="tourner">tourner</option><option value="voler">voler</option><option value="renverser">se renverser</option></select></div>
    </div>
    <p style="margin:16px 0 0"><button class="btn" id="chercher">Rechercher</button></p>
    <div id="resultat" style="margin-top:12px"></div>
  </section>
</div>

<div class="fond" id="fond"><div class="boite" id="boite"></div></div>
<div class="tapis"></div>

<script>
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbxOS3FvbDMj50oNbwVEpE0KgvpbffS4H69KH6u41QWYAItsIhTVQFbOzMGD0JM803eX/exec';

const PTS = {A:0.5, B:1, C:1.5, D:2, E:2.5};
const VERBES = [
  {id:'voler', nom:'Voler', exos:[
    {col:4, nom:'Sol / salto avant', max:'E'}, {col:5, nom:'Sol / sauts', max:'E'},
    {col:6, nom:'Poutre / sortie', max:'E'}, {col:7, nom:'Barres asymétriques / sortie', max:'E'}]},
  {id:'renverser', nom:'Se renverser', exos:[
    {col:8, nom:'Sol / ATR', max:'E'}, {col:9, nom:'Sol / roue', max:'E'},
    {col:10, nom:'Barres asymétriques / ATR', max:'D'}, {col:11, nom:'Poutre / sortie', max:'D'}]},
  {id:'tourner', nom:'Tourner', exos:[
    {col:12, nom:'Sol / roulade avant', max:'E'}, {col:13, nom:'Sol / roulade arrière', max:'E'},
    {col:14, nom:'Barres asymétriques / rotation avant-arrière', max:'E'}, {col:15, nom:'Barres parallèles / rotation avant', max:'D'}]}
];
const $ = s => document.querySelector(s);
const f = n => n.toLocaleString('fr-FR');
const pts = n => f(n) + (n > 1 ? ' pts' : ' pt');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
const exoDe = col => VERBES.flatMap(v => v.exos).find(e => e.col === col);
let verbe = 'voler';

/* classe mémorisée sur la tablette (facultatif) */
try { const c = localStorage.getItem('gym5e-classe'); if (c) $('#classe').value = c; } catch (e) {}
$('#classe2').innerHTML = $('#classe').innerHTML;
$('#classe2').value = $('#classe').value;
$('#classe').onchange = () => { $('#classe2').value = $('#classe').value; try { localStorage.setItem('gym5e-classe', $('#classe').value); } catch (e) {} };
$('#classe2').onchange = () => { $('#classe').value = $('#classe2').value; $('#classe').onchange(); };

/* onglets */
function onglet(rec) {
  $('#t-val').setAttribute('aria-selected', !rec); $('#t-rec').setAttribute('aria-selected', rec);
  $('#p-val').hidden = rec; $('#p-rec').hidden = !rec;
}
$('#t-val').onclick = () => onglet(false);
$('#t-rec').onclick = () => onglet(true);

/* choix du verbe + figures */
function dessiner() {
  $('#verbes').innerHTML = VERBES.map(v =>
    `<button class="v-${v.id}" data-v="${v.id}" aria-pressed="${v.id === verbe}">${v.nom}</button>`).join('');
  const v = VERBES.find(x => x.id === verbe);
  $('#exos').innerHTML = v.exos.map(e => `
    <div class="exo"><div class="exo-t"><b>${e.nom}</b><span class="sur">sur ${f(PTS[e.max])}</span></div>
    <div class="nivs">${'ABCDE'.slice(0, 'ABCDE'.indexOf(e.max) + 1).split('').map(l =>
      `<button class="niv n${l}" data-col="${e.col}" data-niv="${l}"><span>${l}</span><small>${pts(PTS[l])}</small></button>`).join('')}
    </div></div>`).join('');
}
$('#verbes').onclick = ev => { const b = ev.target.closest('button'); if (b) { verbe = b.dataset.v; dessiner(); } };
$('#exos').onclick = ev => { const b = ev.target.closest('.niv'); if (b) demander(Number(b.dataset.col), b.dataset.niv); };

/* fenêtres */
function fenetre(html, actions) {
  $('#boite').innerHTML = html + '<div class="acts"></div>';
  actions.forEach(a => {
    const b = document.createElement('button'); b.className = 'btn' + (a.sec ? ' sec' : ''); b.textContent = a.txt;
    b.onclick = () => { $('#fond').classList.remove('on'); if (a.fn) a.fn(); };
    $('#boite .acts').appendChild(b);
  });
  $('#fond').classList.add('on');
}
const info = msg => fenetre(`<p class="err">${msg}</p>`, [{txt:'OK'}]);

function demander(col, niv) {
  const eleve = $('#eleve').value.trim(), valid = $('#valid').value.trim(), e = exoDe(col);
  if (!eleve || !valid) return info('Écris ton pseudo et celui de ton validateur.');
  if (norm(eleve) === norm(valid)) return info('Tu ne peux pas te valider toi-même : demande à un camarade !');
  fenetre(`<p><b>${esc(eleve)}</b>, valider le niveau <b>${niv}</b> (${pts(PTS[niv])} sur ${f(PTS[e.max])}) pour « ${e.nom} », validé par <b>${esc(valid)}</b> ?<br><small>Si cette figure est déjà validée, l’ancien niveau sera remplacé.</small></p>`,
    [{txt:'Annuler', sec:true}, {txt:'Valider', fn:() => envoyer(col, niv, eleve, valid)}]);
}

async function envoyer(col, niv, eleve, valid) {
  const e = exoDe(col);
  fenetre('<p>Envoi en cours…</p>', []);
  try {
    const r = await fetch(URL_SCRIPT, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'valider', classe:$('#classe').value, eleve, validateur:valid, col, niveau:niv})});
    const d = await r.json();
    if (d.status !== 'ok') return fenetre(`<p class="err">${esc(d.message || 'Erreur inconnue.')}</p>`, [{txt:'OK'}]);
    const ancien = d.precedent ? `<p><small>Remplace le niveau ${esc(d.precedent)} validé avant.</small></p>` : '';
    fenetre(`<p><b>Bravo ${esc(eleve)} !</b><br>${e.nom} : niveau ${niv}</p>
      <div class="tableau"><b>${f(PTS[niv])} / ${f(PTS[e.max])}</b><small>note de la figure</small></div>${ancien}`, [{txt:'Super !'}]);
  } catch (err) {
    fenetre('<p class="err">Impossible d’envoyer : vérifie la connexion et réessaie.</p>', [{txt:'OK'}]);
  }
}

/* recherche */
$('#chercher').onclick = async () => {
  const eleve = $('#eleve2').value.trim(), out = $('#resultat');
  if (!eleve) { out.innerHTML = '<p class="err">Écris ton pseudo.</p>'; return; }
  out.innerHTML = '<p class="info">Recherche en cours…</p>';
  try {
    const q = new URLSearchParams({action:'recherche', classe:$('#classe2').value, eleve, verbe:$('#verbe2').value});
    const d = await (await fetch(URL_SCRIPT + '?' + q)).json();
    if (d.status === 'absent') { out.innerHTML = `<p class="info">Aucune validation pour « ${esc(eleve)} » en ${esc($('#classe2').value)}. Vérifie l’orthographe du pseudo et la classe.</p>`; return; }
    if (d.status !== 'ok') { out.innerHTML = `<p class="err">${esc(d.message || 'Erreur inconnue.')}</p>`; return; }
    out.innerHTML = d.exos.map(e => {
      const n = e.niveau;
      return `<div class="res"><b>${esc(e.nom)}</b><span>${n ? `<span class="badge n${n}">${n}</span> ${pts(PTS[n])} sur ${f(PTS[e.max])}` : `<span class="badge vide">–</span> pas encore validée`}</span></div>`;
    }).join('') + `<p class="info">Dernière validation : ${esc(d.date || 'date inconnue')}</p>`;
  } catch (err) { out.innerHTML = '<p class="err">Impossible de joindre le tableau : vérifie la connexion.</p>'; }
};

dessiner();
</script>
</body>
</html>
